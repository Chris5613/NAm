name: NAm source validation

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "frontend/package*.json"
      - "frontend/scripts/**"
      - "frontend/craco.config.js"
      - "frontend/postcss.config.js"
      - "frontend/tailwind.config.js"
      - "backend/**"
      - ".github/workflows/source-validation.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q backend
      - name: Test project portfolio accounting
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v


  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nam_phase7
          POSTGRES_PASSWORD: phase7_ci_only
          POSTGRES_DB: nam_phase7_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nam_phase7 -d nam_phase7_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PHASE7_POSTGRES_TEST_URL: postgresql+psycopg://nam_phase7:phase7_ci_only@localhost:5432/nam_phase7_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Validate PostgreSQL multi-connection project conflicts
        run: python -m unittest discover -s backend/tests -p 'test_phase7_postgres_locks.py' -v
      - name: Rehearse safe schema baseline on disposable CI PostgreSQL
        run: |
          DATABASE_URL="$PHASE7_POSTGRES_TEST_URL" python -c "from backend.db import init_db; init_db()"
          DATABASE_URL="$PHASE7_POSTGRES_TEST_URL" python -m alembic upgrade head
          DATABASE_URL="$PHASE7_POSTGRES_TEST_URL" python -m alembic current



  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Test frontend parity guards
        run: CI=true npm test -- --watchAll=false --runInBand
        working-directory: frontend
      - name: Compile production UI
        run: CI=true npm run build
        working-directory: frontend
