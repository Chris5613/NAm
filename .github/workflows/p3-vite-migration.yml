name: P3 Vite migration lockfile

on:
  push:
    branches: [p3-vite-migration]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vite.config.mjs"
      - "frontend/index.html"
      - "frontend/src/**"
      - "frontend/tailwind.config.js"
      - ".github/workflows/p3-vite-migration.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p3-vite-migration
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Refresh lockfile for Vite and Vitest
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact refreshed dependency graph
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run Vitest suite
        working-directory: frontend
        run: npm test

      - name: Build Vite production bundle
        working-directory: frontend
        run: npm run build

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "Refresh frontend lockfile for Vite migration"
          git push origin HEAD:p3-vite-migration
