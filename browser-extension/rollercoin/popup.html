<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; }
    body { width: 330px; margin: 0; background: #0b0b0d; color: #f4f4f5; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .title { font-size: 15px; font-weight: 700; }
    .subtitle { margin-top: 3px; color: #71717a; font-size: 11px; }
    .badge { border: 1px solid #27272a; border-radius: 999px; padding: 4px 8px; font-size: 10px; color: #a1a1aa; }
    .badge.ok { border-color: rgba(52,211,153,.35); background: rgba(52,211,153,.1); color: #6ee7b7; }
    .card { margin-top: 14px; border: 1px solid #27272a; background: #111113; border-radius: 14px; padding: 13px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .label { color: #71717a; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .value { margin-top: 4px; font-size: 20px; font-weight: 750; }
    .muted { color: #71717a; font-size: 11px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    input[type="date"] { width: 100%; margin-top: 5px; border: 1px solid #27272a; border-radius: 9px; background: #09090b; color: #f4f4f5; padding: 9px; font: inherit; font-size: 11px; color-scheme: dark; }
    button { width: 100%; margin-top: 12px; border: 0; border-radius: 10px; padding: 10px 12px; background: #34d399; color: #052e23; font-weight: 750; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    button.secondary { margin-top: 8px; border: 1px solid #27272a; background: transparent; color: #d4d4d8; }
    #message { min-height: 16px; margin-top: 10px; font-size: 11px; color: #a1a1aa; }
    .divider { height: 1px; background: #27272a; margin: 12px 0; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">RollerCoin Earnings</div>
      <div class="subtitle">Project Income bridge</div>
    </div>
    <div id="authBadge" class="badge">Checking…</div>
  </div>

  <div class="card">
    <div class="row">
      <div>
        <div class="label">Last synced earnings</div>
        <div id="totalValue" class="value">0.000000 TRX</div>
      </div>
    </div>
    <div id="rangeText" class="muted" style="margin-top:6px;">No sync yet</div>
    <div id="lastSyncText" class="muted" style="margin-top:3px;"></div>

    <div class="divider"></div>

    <div class="grid">
      <label>
        <div class="label">From</div>
        <input id="fromDate" type="date" />
      </label>
      <label>
        <div class="label">To</div>
        <input id="toDate" type="date" />
      </label>
    </div>

    <button id="syncBtn">Sync earnings</button>
    <button id="openBtn" class="secondary">Open RollerCoin</button>
    <div id="message"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
