<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090B" />
    <meta name="description" content="Net Worth Tracker - Track all your investments" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Manrope:wght@400;500&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Net Worth Tracker</title>
    <script>
      window.addEventListener(
        "error",
        function (event) {
          if (
            event.error instanceof DOMException &&
            event.error.name === "DataCloneError" &&
            event.message &&
            event.message.includes("PerformanceServerTiming")
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        },
        true
      );
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
